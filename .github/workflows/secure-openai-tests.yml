name: Secure gateway tests
on:
  push:
    branches: [secure-openai-gateway]
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/secure-gateway.test.mjs
